name: CI

# Runs on the working branch (`test`) and on main, plus any PR. Previously this
# only triggered on `main` — which the team never pushes to (standing rule:
# push to `test` only) — so CI effectively never ran (audit HIGH-1).
on:
  push:
    branches: [main, test]
  pull_request:

jobs:
  ci:
    name: Test · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test

      - name: Lint (zero warnings)
        # Gates on real code-quality rules only. The hardcoded-UI-text guard is
        # reported separately below rather than capped here: it tracks i18n debt
        # (BUG-042), and folding it into the gate meant a warning budget that had
        # to be raised every time a string was added, which is what left this job
        # red on HEAD (BUG-016).
        run: npm run lint:ci

      # The TypeScript files were never type-checked anywhere: tsc was not even
      # installed, and it reported 96 errors the first time it ran. This gates
      # the build on zero, so they cannot come back unnoticed. (BUG-051.)
      - name: Type check (zero errors)
        run: npm run typecheck

      - name: Untranslated UI strings (report only)
        continue-on-error: true
        run: npm run lint:ui

      - name: Production build
        run: npm run build
        env:
          # Vite needs these at build time; use placeholder values in CI
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  # Closes audit HIGH-3 ("zero automated tests on the money/inventory RPC
  # paths"). Spins up a real local Postgres via the Supabase CLI, applies
  # every migration in supabase/migrations/ from scratch (also a standing
  # regression check that the full migration history still applies cleanly —
  # generalizing CRIT-4's "migrations were never proven against a live DB"),
  # then runs supabase/tests/audit_hardening.sql, which RAISEs an exception
  # (failing this job with the exact check named) if any assertion fails.
  # No Supabase account/secrets needed — `supabase start` is purely local.
  db-tests:
    name: DB · Audit Hardening Tests
    runs-on: ubuntu-latest

    # ─────────────────────────────────────────────────────────────────────────
    # TEMPORARILY DISABLED (2026-08-07). Remove this single `if: false` line to
    # re-enable — the job definition below is intact and unchanged.
    #
    # Why: `supabase start` rebuilds a database from scratch by applying every
    # migration to an empty Postgres. That cannot work here, because the schema
    # was originally created by Base44 and the migrations only ever ALTER it.
    # Thirteen core tables are never created by any migration:
    #
    #   customers, customer_notes, email_templates, inventory_units,
    #   manufacturer_batches, notifications, products, rma_tickets,
    #   ticket_activity, ticket_comments, user_preferences, user_roles,
    #   warehouses
    #
    # So the first migration that does e.g. `ALTER TABLE public.products …`
    # (20260740, Sprint 8a) hits "relation does not exist" and the job dies
    # before a single SQL assertion runs. This has failed on every push since
    # the job was added in 9cc2be4 on 2026-07-02 — it has never been green, and
    # has therefore never actually verified anything. A permanently-red check
    # trains people to ignore CI, including the Test/Lint/Build job that does
    # give real signal, so it is parked rather than left failing.
    #
    # What unblocks it: a baseline migration that creates those 13 tables,
    # ordered before 20260524_*. Generate with
    #   supabase db dump --linked --schema public -f baseline.sql
    # then trim to the tables above, make it idempotent, commit as
    # supabase/migrations/00000000000000_baseline.sql, and finally
    #   supabase migration repair --status applied 00000000000000
    # so the live project does not try to re-run it.
    #
    # The only missing piece is Docker. Re-checked 2026-08-12: the CLI is
    # authenticated through the linked project (functions deploy works), but
    # `db dump` runs pg_dump inside a container and fails with "failed to
    # inspect docker image". Three other routes were tried and are closed —
    # information_schema is not exposed through PostgREST, there is no
    # arbitrary-SQL RPC, and a plain select only yields column names, not the
    # types, defaults, keys, indexes or RLS a baseline needs. A baseline built
    # from guessed types would be worse than none: `supabase start` would
    # succeed while quietly diverging from production.
    #
    # So this needs Docker Desktop running, then the four commands above. It is
    # one session's work for someone with Docker, not a research task.
    #
    # SUPERSEDED 2026-08-16 — the owner has ruled out Docker entirely, so this
    # job is not coming back and should be deleted once its SQL assertions have
    # been ported. The `integration` job below covers the same ground without a
    # container: it runs against the *hosted* project, which already has the
    # real schema, so it needs neither Docker nor the baseline dump described
    # above. `supabase/tests/*.sql` remain the reference for what to port.
    #
    # NOTE: `npm run test:db` in package.json has the exact same problem for
    # the same reason — it also starts with `npx supabase start`.
    #
    # None of this affects the live database or deploys. The failure is only in
    # the throwaway CI database.
    # ─────────────────────────────────────────────────────────────────────────
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies all migrations)
        run: supabase start

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run audit-hardening SQL assertions
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/audit_hardening.sql

      - name: Run inventory-hardening SQL assertions
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/inventory_hardening.sql

      - name: Run inventory-RPC-hardening SQL assertions (part 2)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/inventory_hardening2.sql

      - name: Run vendor-payments (Accounts Payable) SQL assertions
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/vendor_payments.sql

      - name: Run Warehouse Module R1 (RMA locations) SQL assertions
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/inventory_hardening3.sql

      - name: Stop Supabase
        if: always()
        run: supabase stop

  # ───────────────────────────────────────────────────────────────────────────
  integration:
    name: DB · Integration (RLS / RPC / schema drift)
    runs-on: ubuntu-latest

    # The Docker-free replacement for db-tests above.
    #
    # Runs against the HOSTED Supabase project rather than a container. That
    # sidesteps both of the things that kept db-tests red: no container runtime
    # is needed, and no baseline migration is needed either, because the target
    # already has the schema Base44 created.
    #
    # Scope, honestly: this asserts that RLS refuses an anonymous caller, that
    # SECURITY DEFINER RPCs reject unauthorized callers, and that every column
    # the app selects still exists. It does NOT exercise the write paths those
    # RPCs guard — doing that against the live project would create real
    # records, which is why tests/integration gates any writing suite behind
    # SUPABASE_TEST_ALLOW_WRITES. Closing that last gap needs a second hosted
    # project to point at, not a change here.
    #
    # Reuses the same VITE_SUPABASE_* secrets the build job already reads, so
    # there is nothing new to configure. Both are public-by-design values (the
    # anon key ships in the browser bundle), but keeping them in secrets means a
    # fork cannot aim CI at this project. Without them the suite skips itself
    # and the job stays green rather than failing on a fork — note the build
    # job's placeholder fallback is deliberately NOT used here, because a
    # placeholder URL would make every refusal-based assertion pass for the
    # wrong reason. Skipping is honest; a false green is not.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run integration tier
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run test:integration
